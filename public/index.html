<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Turnos en línea</title>
</head>

<body>
    <h1>Reserva de turnos</h1>
    <form id="formulario">
        <label for="nombre">Nombre</label>
        <input id="nombre" autocomplete="off">
        <label for="hora">Horario disponible</label>
        <select id="hora"></select>
        <button type="submit">Reservar</button>
    </form>
    <p id="mensaje"></p>
    <h2>Turnos reservados</h2>
    <ul id="lista"></ul>
    <script src="app.js"></script>
</body>

</html>
